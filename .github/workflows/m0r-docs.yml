name: Offline contracts and Lua domain
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hydrate only declared runtime assets
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          inventory=json.loads(Path('source-inventory.json').read_text())
          paths=sorted({entry['source'] for entry in inventory['runtime_assets']})
          subprocess.run(['git','lfs','pull','--include='+','.join(paths),'--exclude='],check=True)
          PY
      - name: Asset mapping and historical proof boundary regressions
        run: python3 -B scripts/test_asset_boundaries.py
      - name: Native model inputs and offline bind contract
        run: python3 -B scripts/check_native_assets.py
      - name: Shepherd clip, graph and immutable-geometry contracts
        run: python3 -B scripts/test_shepherd_motion.py
      - name: Canonical version and current mirrors
        run: python3 -B scripts/check_versions.py --root . --json
      - name: Documentation and design contracts only
        run: python3 -B scripts/validate_m0r.py
      - name: Source boundaries, translations and frozen art
        run: python3 -B scripts/validate_foundation.py
      - name: Publication archive and evidence-boundary regressions
        run: python3 -B scripts/test_publication.py
      - name: Isolated offline Lua test dependency
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check lupa==2.6 assimp_py==1.1.0 numpy==2.3.5
      - name: Independent Assimp parser for authored animation files
        run: .ci-venv/bin/python -B scripts/check_motion_imports.py
      - name: Serialized tail-root blend drift regression
        run: .ci-venv/bin/python -B scripts/check_tail_blends.py
      - name: Actual mesh skin and serialized clip deformation regressions
        run: .ci-venv/bin/python -B scripts/check_skin_deformation.py
      - name: Execute Lua 5.1 domain tests (not PZ runtime)
        run: .ci-venv/bin/python -B scripts/test_domain.py
