name: M0R documentation consistency
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Canonical version and current mirrors
        run: python3 -B scripts/check_versions.py --root . --json
      - name: Documentation and design contracts only
        run: python3 -B scripts/validate_m0r.py
